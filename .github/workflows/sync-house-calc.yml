name: sync-house-calc
on:
  push:
    paths:
      - '.github/workflows/sync-house-calc.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tool
        run: curl -sSL -o house-calc/index.html "https://aka.doubaocdn.com/s/ZHTFZh83IM"
      - name: Commit
        run: |
          ls -l house-calc/index.html
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add house-calc/index.html
          git commit -m "house-calc: 公积金口径对齐官方计算器" || echo "no change"
          git push
